[project]
name = "crimelens-domain"
version = "0.1.0"
description = "CrimeLens shared domain and application contracts"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crimelens_domain"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
