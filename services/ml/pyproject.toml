[project]
name = "crimelens-ml"
version = "0.1.0"
description = "CrimeLens offline ML pipelines"
requires-python = ">=3.12"
dependencies = [
  "crimelens-domain",
  "polars>=1.17",
  "numpy>=2.1",
]

[tool.uv.sources]
crimelens-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crimelens_ml"]

[tool.hatch.build.targets.wheel.sources]
"crimelens_ml" = "src/crimelens_ml"
