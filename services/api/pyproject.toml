[project]
name = "crimelens-api"
version = "0.1.0"
description = "CrimeLens FastAPI modular monolith"
requires-python = ">=3.12"
dependencies = [
  "crimelens-domain",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary,pool]>=3.2",
  "GeoAlchemy2>=0.15",
  "redis>=5.2",
  "python-multipart>=0.0.20",
  "argon2-cffi>=23.1",
  "PyJWT>=2.10",
  "alembic>=1.14",
]

[tool.uv.sources]
crimelens-domain = { workspace = true }

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
