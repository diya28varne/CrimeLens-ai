[project]
name = "crimelens-worker"
version = "0.1.0"
description = "CrimeLens Taskiq worker"
requires-python = ">=3.12"
dependencies = [
  "crimelens-domain",
  "taskiq>=0.11",
  "taskiq-redis>=1.0",
  "pydantic-settings>=2.7",
]

[tool.uv.sources]
crimelens-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
