name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync workspace
        # Install workspace packages + default `dev` dependency groups (pytest, etc.)
        run: uv sync --all-packages --group dev
      - name: Domain tests
        run: uv run --package crimelens-domain pytest packages/py-domain/tests -q
      - name: API unit tests
        run: uv run --package crimelens-api pytest services/api/tests/unit -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install
      - name: Typecheck
        run: pnpm --filter @crimelens/web typecheck
      - name: Build
        run: pnpm --filter @crimelens/web build
